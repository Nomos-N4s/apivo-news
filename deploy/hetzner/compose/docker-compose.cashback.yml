# The cashback money substrate — Blnk and Redis — layered over
# docker-compose.yml.
#
# Loaded the same way the local Postgres is: by listing this file in
# COMPOSE_FILE (deploy/hetzner/env/stack.env.example shows both shapes). An
# environment that does not list it has no ledger, no Redis, and no cashback
# routes — which is the correct state for every environment until the
# ADR-0002 spikes have passed on it.
#
# ---------------------------------------------------------------------------
# Why a second runtime service at all
# ---------------------------------------------------------------------------
#
# ADR-0002. The constitution permits exactly one exception to
# one-process-per-application: a self-hosted, Apache/MIT-class open-source
# ledger, carrying the correctness burden (double entry, idempotency,
# reconciliation) we would otherwise write ourselves. Blnk is that ledger and
# Redis is what Blnk requires for queueing and caching.
#
# Redis holds NO source of truth. Losing it loses throughput, not money: a
# credit is only ever created from a polled, stored, verified network
# transaction, and the outbox replays what a lost queue dropped. That is why
# it is configured below with no persistence at all rather than with a volume
# nobody would ever restore from.
#
# ---------------------------------------------------------------------------
# Which database Blnk uses
# ---------------------------------------------------------------------------
#
# The same Postgres instance as the api, in its own `blnk` schema — one
# database, one backup, one point-in-time recovery, and the C-1 zero-sum check
# stays a plain SQL query instead of a distributed reconciliation. Spike S1
# has now PASSED against that shape (ADR-0002); the recorded fallback of a
# Blnk-owned Postgres is not needed.
#
# TWO roles, not one, and therefore TWO DSNs in TWO files:
#
#   ${APIVO_ETC}/<env>/blnk-migrate.env   the database OWNER, read only by
#                                         the one-shot blnk-migrate container
#   ${APIVO_ETC}/<env>/blnk.env           blnk_app, read by the server and
#                                         the worker, which run continuously
#
# Both are credentials, so both are read by the Docker daemon through
# `env_file` — never interpolated by compose, never in the reconciler's
# environment, never in `docker compose config` output. Same rule as api.env,
# for the same reason.
#
# The role itself is created once by an operator with
# scripts/spikes/ledger_schema/bootstrap.sql, which is the production recipe
# rather than a fixture. See the blnk-migrate service below for why the split
# is required and not merely tidy.
#
# There is deliberately NO `depends_on: postgres` here. Staging and
# production have no `postgres` service at all, and a depends_on naming a
# service that does not exist fails the whole configuration — the same trap
# documented in docker-compose.local-db.yml, which is why the api's dependency
# on Postgres lives there and not in the base file.

# ---------------------------------------------------------------------------
# Why these images carry digests
# ---------------------------------------------------------------------------
#
# A tag is mutable. `jerryenebeli/blnk:0.15.2` is whatever that name points at
# on the day a container is pulled, and the base compose file already refuses
# to run the api or the web on anything less than a digest
# (`${APIVO_API_IMAGE:?the reconciler must pin an api image digest}`). Running
# the LEDGER on a mutable tag would have been the one place in the deployment
# where a silent retag could change the binary that moves members' money, with
# no diff and no review.
#
# The form is `repo:tag@sha256:...`, which Docker resolves by digest and a
# reviewer reads by version — the tag is documentation, the digest is the
# contract.
#
# These are pinned HERE rather than resolved at runtime like the api and web
# images, and the difference is the point. A channel tag MOVES, which is why
# the reconciler has to resolve `:qa` to a digest on every tick. A third-party
# version does not move: bumping it is a deliberate decision, so it belongs in
# a file where it shows up as a diff somebody approves.
#
# Both digests are multi-architecture indexes covering linux/amd64 and
# linux/arm64, so the pin does not quietly commit this deployment to one
# architecture.

services:
  # The ledger's schema, migrated once per rollout AS THE DATABASE OWNER.
  #
  # This is the founder's split posture (2026-08-24), and it is the same shape
  # docker-compose.yml and the CI job run — one answer in the repository, not
  # one per environment:
  #
  #   the database owner   runs `blnk migrate up`. Migrations are DDL, they
  #                        happen on a deploy, and they are reviewed.
  #   blnk_app             runs the SERVER and the WORKER below, every second
  #                        of every day, with USAGE on one schema and DML on
  #                        its tables. No DDL, no CREATE on the database, no
  #                        reach into `public`.
  #
  # Spike S1 established why the split is needed rather than convenient.
  # Blnk's first migration issues `CREATE SCHEMA IF NOT EXISTS blnk`, and
  # PostgreSQL checks the database-level CREATE privilege BEFORE it takes the
  # IF NOT EXISTS shortcut — so pre-creating the schema does not avoid the
  # grant, and a single role would need CREATE on the database permanently for
  # one statement on one deploy.
  #
  # The two roles are two FILES, not two keys in one file: Blnk reads the DSN
  # from `BLNK_DATA_SOURCE_DNS` whichever job it is doing, so the only way to
  # hand each container a different one through `env_file` — and keep both out
  # of the reconciler's environment and out of `docker compose config` output
  # — is a file per role. That is what makes the owner credential absent from
  # the long-lived process rather than merely unused by it.
  #
  # The operator creates the role once with the recipe in
  # scripts/spikes/ledger_schema/bootstrap.sql, which is the production
  # recipe and not a fixture.
  #
  # A one-shot, exactly like docker-compose.yml's: `blnk start` does not
  # migrate, and a server answering before its tables exist would fail per
  # request instead of refusing to start. `service_completed_successfully`
  # below is what makes the ordering real rather than hopeful.
  blnk-migrate:
    image: jerryenebeli/blnk:0.15.2@sha256:796518b1025e529a8d899c604a2b9f76e366434cc5d09979ecdf85367877f6cf
    container_name: apivo-${APIVO_ENV}-blnk-migrate
    restart: "no"
    entrypoint: ["blnk", "migrate", "up"]
    env_file:
      # The OWNER's DSN. The only file on the host that carries it to a
      # container, and the container it carries it to lives for seconds.
      - ${APIVO_ETC:-/etc/apivo}/${APIVO_ENV}/blnk-migrate.env
    environment:
      # Unused by the migration itself, and still required: Blnk validates its
      # whole configuration before running any command.
      BLNK_REDIS_DNS: apivo-${APIVO_ENV}-redis:6379
      TZ: Etc/UTC
    networks:
      - edge
      - data
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: ${APIVO_LOG_MAX_SIZE:-10m}
        max-file: ${APIVO_LOG_MAX_FILE:-3}
    security_opt:
      - no-new-privileges:true

  # The ledger API. Cluster-internal in every sense that matters: no `ports`,
  # so nothing outside the compose networks reaches it, and Caddy has no site
  # block naming it. The only client is the api, over the `data` network by
  # container name.
  blnk:
    image: jerryenebeli/blnk:0.15.2@sha256:796518b1025e529a8d899c604a2b9f76e366434cc5d09979ecdf85367877f6cf
    container_name: apivo-${APIVO_ENV}-blnk
    restart: unless-stopped
    # `blnk start` ONLY. The migration is blnk-migrate above, as the owner;
    # this process runs as blnk_app and has no DDL rights to migrate with.
    entrypoint: ["blnk", "start"]
    env_file:
      # blnk_app's DSN. Note the file name difference from blnk-migrate above
      # — that is the whole split, and it is the thing to check first if the
      # ledger ever reports a permission error.
      - ${APIVO_ETC:-/etc/apivo}/${APIVO_ENV}/blnk.env
    environment:
      # Blnk reads either /blnk.json or environment variables prefixed BLNK_.
      # The environment is used here so the credentials in the set can stay in
      # env_file above rather than being baked into a JSON file this
      # repository would have to template.
      BLNK_REDIS_DNS: apivo-${APIVO_ENV}-redis:6379
      BLNK_PROJECT_NAME: apivo-cashback
      BLNK_SERVER_PORT: "5001"
      # THE switch that makes Blnk check credentials at all.
      #
      # An earlier revision of this file set BLNK_SERVER_SECRET_KEY and said
      # that made the ledger "demand a credential". It does not. In blnk
      # v0.15.2 the key is inert on its own:
      #
      #   api/middleware/auth.go, Authenticate():
      #       if err == nil && conf != nil && !conf.Server.Secure {
      #           // Skip authentication when secure mode is disabled
      #           c.Next()
      #           return
      #       }
      #
      # `Server.Secure` is `BLNK_SERVER_SECURE` (config/config.go), it is
      # never given a default, so it is false, and Blnk itself logs
      # "SECURITY: server.secure is false - API authentication is DISABLED"
      # on every start. Without this line the ledger accepts any request that
      # reaches it, key or no key.
      #
      # It fails CLOSED if the key is missing: secure with an empty
      # BLNK_SERVER_SECRET_KEY refuses every authenticated route with 401
      # rather than letting it through, which is the right way round.
      #
      # `/health` is unaffected - auth.go skips it BEFORE this check, so the
      # healthcheck below keeps working with authentication on.
      BLNK_SERVER_SECURE: "true"
      TZ: Etc/UTC
    networks:
      # `data` for Postgres and Redis; `edge` because staging and production
      # reach Supabase across the public internet and `data` is
      # `internal: true`. Exactly the api's network list, for exactly the
      # api's reason.
      - edge
      - data
    depends_on:
      redis:
        condition: service_healthy
      blnk-migrate:
        condition: service_completed_successfully
    # Blnk serves an unauthenticated `GET /health` (added upstream in v0.10.3;
    # this image is 0.15.2), and the probe is a real HTTP request rather than
    # a port knock because a listening socket says nothing about whether the
    # ledger reached its database.
    #
    # A compose healthcheck runs INSIDE the container, so it can only use a
    # client the image actually ships. This one does: the upstream Dockerfile
    # installs `wget` in its final debian-slim stage to fetch a signing key
    # and removes only the apt lists afterwards, never the package. `--spider`
    # is avoided deliberately - it sends HEAD, and a route that answers GET is
    # not obliged to answer HEAD.
    #
    # `start_period` no longer covers a migration - blnk-migrate does that
    # before this container is created at all - but it is kept, at a shorter
    # value, for the connection setup and first Redis handshake. Nothing here
    # should need thirty seconds now, and if it does, that is a finding rather
    # than something to absorb silently.
    #
    # This is what makes the reconciler's `up -d --wait` gate real for the
    # ledger. What it still does not prove is that the ledger's numbers are
    # right; only the continuous C-1 zero-sum check does that, and it is a
    # query over real rows rather than a liveness ping.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: ${APIVO_LOG_MAX_SIZE:-10m}
        max-file: ${APIVO_LOG_MAX_FILE:-3}
    deploy:
      resources:
        limits:
          cpus: ${APIVO_BLNK_CPUS:-1.0}
          memory: ${APIVO_BLNK_MEMORY:-512M}
    security_opt:
      - no-new-privileges:true

  # Blnk's background worker. Upstream requires it as a separate process: the
  # server accepts transactions onto the queue and this drains it.
  #
  # It is a RUNTIME process, so it takes blnk.env - the same blnk_app DSN the
  # server uses, and not the owner's. Draining a queue is DML; nothing a
  # worker does needs DDL, and giving it the owner's credential would put that
  # credential in a second long-lived container for no gain.
  blnk-worker:
    image: jerryenebeli/blnk:0.15.2@sha256:796518b1025e529a8d899c604a2b9f76e366434cc5d09979ecdf85367877f6cf
    container_name: apivo-${APIVO_ENV}-blnk-worker
    restart: unless-stopped
    entrypoint: ["blnk", "workers"]
    env_file:
      - ${APIVO_ETC:-/etc/apivo}/${APIVO_ENV}/blnk.env
    environment:
      BLNK_REDIS_DNS: apivo-${APIVO_ENV}-redis:6379
      BLNK_PROJECT_NAME: apivo-cashback
      # The worker serves an asynq dashboard at /monitoring on 5004, and
      # `MetricsAuthHandler(secure, token, ...)` lets everything through when
      # secure is false - so without this the queue dashboard is open to
      # anything on the data network. With secure true and no
      # BLNK_METRICS_BEARER_TOKEN, that handler refuses outright
      # (api/middleware/middleware.go), which is the state we want: we do not
      # use the dashboard.
      #
      # The worker's own /health is registered directly on its mux and is not
      # behind that handler, so the healthcheck below is unaffected.
      BLNK_SERVER_SECURE: "true"
      TZ: Etc/UTC
    networks:
      - edge
      - data
    depends_on:
      redis:
        condition: service_healthy
      # The worker queries the ledger's tables from its first tick, so it
      # waits on the same migration the server does. Without this it starts
      # against a schema that may not exist yet and spends its early life in
      # a restart loop that looks like a Redis problem.
      blnk-migrate:
        condition: service_completed_successfully
    # The worker serves its OWN `GET /health` on 5004, and this was wrong in an
    # earlier revision of this file, which claimed it had no health route.
    #
    # It does. In blnk v0.15.2, `runWorkers` (cmd/workers.go) calls
    # `startMonitoringServer(conf)` unconditionally, and that registers
    # `/health` returning 200 `{"status": "UP", "service": "worker"}`. Only
    # `/monitoring/` and `/metrics` are wrapped in `MetricsAuthHandler`, so
    # `/health` needs no credential. The port is `conf.Queue.MonitoringPort`,
    # whose default is `DEFAULT_MONITORING_PORT = "5004"` (config/config.go) —
    # overridable with `BLNK_QUEUE_MONITORING_PORT`, which is why 5004 is not
    # restated as a container port anywhere else in this file.
    #
    # It matters because the reconciler gates a rollout on `up -d --wait`, and
    # that waits only on services declaring a healthcheck. Without this, a
    # worker that died on its first Redis call would let a deploy report
    # success while every transaction sat QUEUED — money not moving, and
    # nothing anywhere saying so.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${APIVO_LOG_MAX_SIZE:-10m}
        max-file: ${APIVO_LOG_MAX_FILE:-3}
    deploy:
      resources:
        limits:
          cpus: ${APIVO_BLNK_WORKER_CPUS:-1.0}
          memory: ${APIVO_BLNK_WORKER_MEMORY:-512M}
    security_opt:
      - no-new-privileges:true

  # Blnk's queue and cache. On the internal network only: it needs nothing
  # from the internet and nothing from the internet needs it.
  redis:
    image: redis:7.2.4-alpine@sha256:c8bb255c3559b3e458766db810aa7b3c7af1235b204cfdb304e79ff388fe1a5a
    container_name: apivo-${APIVO_ENV}-redis
    restart: unless-stopped
    command:
      - redis-server
      # No RDB snapshots and no AOF. This is not a corner cut to save disk:
      # persisting a queue whose contents are worth nothing after a restart
      # would invite someone to restore from it, and a restored queue is a
      # second, stale account of what the ledger was asked to do. The outbox
      # is the durable record; Redis is the fast path.
      - --save
      - ""
      - --appendonly
      - "no"
      # `noeviction` so a full Redis REFUSES a write instead of silently
      # dropping a queued transfer. A dropped transfer is a money bug that
      # leaves no trace; a refused one is an error the caller sees.
      - --maxmemory
      - ${APIVO_REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - noeviction
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: ${APIVO_LOG_MAX_SIZE:-10m}
        max-file: ${APIVO_LOG_MAX_FILE:-3}
    deploy:
      resources:
        limits:
          cpus: ${APIVO_REDIS_CPUS:-0.5}
          memory: ${APIVO_REDIS_MEMORY:-256M}
    security_opt:
      - no-new-privileges:true

  # What loading this file tells the api.
  #
  # These four are STRUCTURAL, not an operator's choice, so they are set here
  # and not in api.env — the same reasoning that puts HTTP_ADDR and APP_ENV in
  # the base compose file. Listing this overlay in COMPOSE_FILE *is* the
  # decision to run cashback on this environment, and the ledger's address is
  # a container name this file chose.
  #
  # NETWORK_DRIVER and the affiliate network credentials are the opposite:
  # they are an operator's choice against a founder question that is still
  # open (Q1), so they live in api.env and default to the fixture adapter.
  api:
    environment:
      CASHBACK_ENABLED: "true"
      LEDGER_DRIVER: blnk
      BLNK_URL: http://apivo-${APIVO_ENV}-blnk:5001
      REDIS_URL: redis://apivo-${APIVO_ENV}-redis:6379
    # `service_started` and NOT `service_healthy`, even though blnk now has a
    # healthcheck worth waiting on. This host serves a newspaper as well as a
    # wallet, and one binary serves both: a ledger that cannot pass its probe
    # must not keep the api from starting, because that would take the public
    # site down with it. Same rule the editorial routes already follow, where
    # a missing JWKS_URL unmounts them and leaves readers served.
    #
    # The rollout is still gated on the ledger being healthy - `up -d --wait`
    # waits on every service that has a healthcheck, whatever depends on what
    # - so this costs no safety at rollout time and buys a failure mode that
    # degrades instead of going dark.
    depends_on:
      blnk:
        condition: service_started
