# One pull request, running.
#
# `APIVO_PREVIEW` is the preview's name — `pr-142` — and it comes from a
# CHANNEL TAG IN THE REGISTRY, not from anything that reached this host over
# the network. CI pushes `:pr-142` when the pull request opens or is pushed
# to, and DELETES that tag when the pull request closes. The host lists the
# tags every minute and converges: a tag with no stack gets one, a stack with
# no tag is destroyed.
#
# That is what keeps previews inside the same pull-based model as everything
# else. Teardown is not a webhook anyone could forge or forget to send; it is
# the absence of a tag, and absence converges just as reliably as presence.
#
# Previews deliberately DO NOT get their own Postgres container. On one VPS
# that would be N Postgres instances for N open pull requests, and the box
# would fall over long before the pull requests did. They share one instance
# (docker-compose.preview-db.yml) with a database each, created and dropped
# by the reconciler. Separate database, separate schema, no cross-talk — the
# isolation that matters for a preview, at a fraction of the memory.

name: apivo-${APIVO_PREVIEW}

services:
  api:
    image: ${APIVO_PREVIEW_API_IMAGE:?the preview reconciler must pin an api image digest}
    container_name: apivo-${APIVO_PREVIEW}-api
    restart: unless-stopped
    # Written by the reconciler when the preview is created: DATABASE_URL for
    # this pull request's own database, and JWKS_URL so an editor can sign in.
    env_file:
      - ${APIVO_STATE_DIR:-/var/lib/apivo}/previews/${APIVO_PREVIEW}/api.env
    environment:
      HTTP_ADDR: ":8080"
      # Hardened, like every other environment. A preview that runs with the
      # guards off cannot show you the bug the guards would have caught, which
      # is the entire reason to look at one.
      APP_ENV: prod
      LOG_LEVEL: info
      # A preview polls nothing and translates nothing. Feeds cost bandwidth
      # and the translation provider costs real money per article, and neither
      # tells a reviewer anything about the change in front of them. Both are
      # off by the documented disable switch rather than left to a default.
      POLL_INTERVAL: "0"
      TRANSLATION_INTERVAL: "0"
    networks:
      - preview-edge
      - preview-data
    logging:
      driver: json-file
      options:
        max-size: ${APIVO_PREVIEW_LOG_MAX_SIZE:-5m}
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: ${APIVO_PREVIEW_API_CPUS:-0.5}
          memory: ${APIVO_PREVIEW_API_MEMORY:-384M}
    security_opt:
      - no-new-privileges:true

  web:
    image: ${APIVO_PREVIEW_WEB_IMAGE:?the preview reconciler must pin a web image digest}
    container_name: apivo-${APIVO_PREVIEW}-web
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      API_BASE_URL: http://apivo-${APIVO_PREVIEW}-api:8080
      PUBLIC_APP_VERSION: ${APIVO_PREVIEW_VERSION:-preview}
      # Show the cashback surfaces to a reviewer.
      #
      # A preview runs APP_ENV=prod for fidelity, and it does not include
      # docker-compose.cashback.yml — so CASHBACK_ENABLED is off, every
      # cashback call answers 404, and the screens render an unavailable band.
      # A preview that cannot show the change is a preview that has stopped
      # doing its job.
      #
      # This makes the cashback pages, and only those, answer from their
      # built-in fixtures, with the fixture band above every one of them
      # saying so in the reading language. It moves no money: the fixture
      # client refuses every operator decision with a 503 naming itself.
      #
      # It belongs to this file alone. QA, staging and production include
      # docker-compose.yml instead, which does not set it, and the frontend
      # reads it as the exact string "1" so a half-set value elsewhere does
      # nothing. The reader pages keep their own refusal untouched.
      CASHBACK_PREVIEW_FIXTURES: "1"
      # See docker-compose.yml for why the container serves TLS: Astro.url
      # takes its scheme from the socket, and a preview is the environment
      # that proved it, because a WILDCARD host cannot have the Origin
      # rewrite the named environments used to paper over it. Sign-in is
      # itself a form post, so this is what makes the auth block below
      # usable rather than merely present.
      SERVER_CERT_PATH: /run/web-certs/web.crt
      SERVER_KEY_PATH: /run/web-certs/web.key
      # Supabase Auth, from the reconciler, sharing QA's nonprod project.
      #
      # This block used to hardcode empty strings, and said handing "a
      # throwaway environment built from an unreviewed branch the keys to a
      # real auth project" was not worth the convenience of a sign-in. Two
      # things were wrong with that.
      #
      # It is not a key. PUBLIC_SUPABASE_ANON_KEY is public by construction —
      # it ships to every browser that loads QA — and JWKS_URL is a published
      # endpoint. The service-role key, which is the one that matters, has
      # never been in any env file on this host and still is not.
      #
      # And it was not a convenience. A preview exists to be reviewed BEFORE
      # the work reaches QA, and every editorial screen is behind sign-in, so
      # a preview that cannot authenticate cannot show a reviewer the thing
      # they opened it for. The editorial half of this product was
      # untestable in the one place it was meant to be tested first.
      #
      # What stays true: the preview's DATABASE is its own, so nothing done
      # here reaches QA's records. The account rows come from QA (the
      # reconciler copies its editors in), which is what makes a token from
      # the shared project resolve to somebody this database knows.
    env_file:
      - ${APIVO_STATE_DIR:-/var/lib/apivo}/previews/${APIVO_PREVIEW}/web.env
    volumes:
      # One certificate for every preview on this host. It is self-signed
      # and never verified, so a name per preview would be ceremony: what it
      # buys is a socket that reports itself encrypted.
      - ${APIVO_ETC:-/etc/apivo}/preview/web-certs:/run/web-certs:ro
    networks:
      - preview-edge
    logging:
      driver: json-file
      options:
        max-size: ${APIVO_PREVIEW_LOG_MAX_SIZE:-5m}
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: ${APIVO_PREVIEW_WEB_CPUS:-0.5}
          memory: ${APIVO_PREVIEW_WEB_MEMORY:-384M}
    security_opt:
      - no-new-privileges:true

networks:
  # Shared by every preview and by Caddy, and external because Caddy joins it
  # ONCE at boot. A network per preview would mean attaching the running proxy
  # to a new network for every pull request opened, which is a restart of the
  # thing standing in front of QA and Staging.
  #
  # So previews can reach one another. They are all equally unreviewed code
  # from open branches, and what matters is that this network reaches neither
  # QA, nor Staging, nor either of their databases.
  preview-edge:
    name: apivo-preview-edge
    external: true

  preview-data:
    name: apivo-preview-data
    external: true
