# STRUCTURE-ONLY STUB — never put a real credential in this file.
#
# The value below is a placeholder so the manifest set is self-describing and
# validates. In a real cluster this Secret is created out of band (see
# README.md) with the Supabase (EU) connection string:
#
#   kubectl -n apivo create secret generic apivo-secrets \
#     --from-literal=DATABASE_URL='<real connection string>'
#
# Parity with local development: DATABASE_URL is the same key the binary reads
# from .env.example, where it points at the docker-compose Postgres.
#
# TRANSLATION_API_KEY (T018) also lives here once a translation provider is
# decided - add --from-literal=TRANSLATION_API_KEY='<provider key>' to the
# command above. It is DELIBERATELY not stubbed below: the api-deployment
# maps it with `optional: true`, so a Secret without the key runs fine (a
# self-hosted provider needs none), whereas a placeholder value would be
# forwarded to the binary as if an operator had chosen a provider.
#
# The BLNK_* keys below are needed ONLY on a cluster that has applied
# deploy/k8s/cashback/ (ADR-0002). They ARE stubbed, unlike
# TRANSLATION_API_KEY, because the ledger cannot run without them: the
# cashback Deployments map them as required secretKeyRefs, so a cluster that
# applies the ledger without adding them gets pods that refuse to start and
# say why. A cluster that never applies that directory never references them.
#
# NETWORK_<DRIVER>_API_KEY and NETWORK_<DRIVER>_API_SECRET are one affiliate
# network's credentials - NETWORK_LINKWISE_API_KEY, NETWORK_AWIN_API_SECRET,
# one pair per entry in NETWORKS - and are deliberately NOT stubbed: with
# NETWORKS empty or naming only `fixture` nothing reads them, and the api maps
# them optionally. Add them with --from-literal when a live network is named.
# NETWORK_<DRIVER>_ACCOUNT_ID is not a credential - the config package logs it
# in clear - so it lives in deploy/k8s/cashback/cashback-configmap.yaml
# instead, beside the NETWORKS list that decides which blocks are read at all.
#
# The flat NETWORK_API_KEY and NETWORK_API_SECRET these replace are REFUSED by
# the api rather than aliased onto the first network: a Secret still carrying
# them gets pods that will not start and say which key to rename.
apiVersion: v1
kind: Secret
metadata:
  name: apivo-secrets
  labels:
    app.kubernetes.io/name: apivo-secrets
    app.kubernetes.io/part-of: apivo-news
type: Opaque
stringData:
  # sslmode is load-bearing: the cluster runs APP_ENV=prod, where the binary
  # refuses to start on a URL that permits an unencrypted session. Prefer
  # verify-full, which also proves the server is the one it claims to be.
  DATABASE_URL: "postgres://PLACEHOLDER_USER:PLACEHOLDER_PASSWORD@PLACEHOLDER_HOST:5432/apivo?sslmode=verify-full" # CHANGE-ME placeholder, not a credential
  # The ledger's role, NOT the api's. It owns the `blnk` schema and has no
  # rights in `public`, which is what makes "Blnk's migrations never touch
  # public" enforceable rather than hoped for (ADR-0002 spike S1). Same
  # instance as DATABASE_URL above: one database, one backup, one
  # point-in-time recovery, and the C-1 zero-sum check stays a plain SQL query
  # over real rows instead of a distributed reconciliation.
  #
  # TWO ledger DSNs, one per role - the founder's split posture (2026-08-24).
  # Migrations are DDL and run as the OWNER; the server and the worker run as
  # blnk_app, which owns nothing. Spike S1 found why the split is required:
  # Blnk's first migration issues CREATE SCHEMA IF NOT EXISTS blnk, and
  # PostgreSQL checks the database-level CREATE privilege BEFORE the IF NOT
  # EXISTS shortcut, so a single role would need CREATE on the database
  # permanently for one statement on one deploy.
  #
  # blnk_app is created once, by an operator, with the recipe in
  # scripts/spikes/ledger_schema/bootstrap.sql - the production recipe, not a
  # fixture. No search_path parameter is needed on its DSN: that file sets it
  # on the role itself.
  BLNK_DATA_SOURCE_DNS: "postgres://PLACEHOLDER_BLNK_APP_USER:PLACEHOLDER_PASSWORD@PLACEHOLDER_HOST:5432/apivo?sslmode=verify-full" # CHANGE-ME placeholder, not a credential
  # The database OWNER - usually the same role as DATABASE_URL above. Read
  # ONLY by the migration initContainer, which lives for seconds; keeping it
  # under its own key is what keeps it out of the long-lived server's
  # environment rather than merely unused by it.
  BLNK_MIGRATE_DSN: "postgres://PLACEHOLDER_USER:PLACEHOLDER_PASSWORD@PLACEHOLDER_HOST:5432/apivo?sslmode=verify-full" # CHANGE-ME placeholder, not a credential
  #
  # The two halves of one credential: the ledger ACCEPTS
  # BLNK_SERVER_SECRET_KEY, the api PRESENTS BLNK_SECRET_KEY, and they must be
  # EQUAL. Neither makes the ledger check anything on its own - that is
  # BLNK_SERVER_SECURE in deploy/k8s/cashback/blnk-configmap.yaml, without
  # which blnk skips authentication entirely and both keys are inert. Not optional on a cluster: it runs APP_ENV=prod, and with
  # cashback enabled the api refuses to start when BLNK_SECRET_KEY is unset -
  # "a ledger reachable without a credential is a ledger anybody on that
  # network can post to, and postings are money".
  BLNK_SERVER_SECRET_KEY: "CHANGE-ME-generate-one-value-and-use-it-for-both"
  BLNK_SECRET_KEY: "CHANGE-ME-generate-one-value-and-use-it-for-both"
