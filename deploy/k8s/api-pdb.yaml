# Keeps at least one api replica serving through voluntary disruptions
# (node drains, cluster upgrades); pairs with the topology spread in the
# Deployment so both replicas do not share a node in the first place.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: apivo-news
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: apivo-news
