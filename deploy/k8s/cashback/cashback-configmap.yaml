# What applying this directory tells the api.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOES TODAY: it delivers the keys. It does not yet switch anything.
#
# The Go binary on `main` reads NONE of the variables below and mounts no
# cashback routes. Config parsing arrives with T001 (#291) and route mounting
# with T040 (#187); until both have landed, applying this directory gives a
# cluster a running Blnk and Redis and an api that ignores this ConfigMap
# entirely.
#
# The manifests are still correct and still worth having — the ledger has to
# exist before anything can be wired to it, and the wiring tasks need
# something to point at. But an operator applying this set today gets ledger
# INFRASTRUCTURE, not a working cashback product, and this file says so rather
# than letting them find out.
# ---------------------------------------------------------------------------
#
# The api Deployment lists this ConfigMap in `envFrom` with `optional: true`,
# so a cluster that has never applied `deploy/k8s/cashback/` runs the api with
# none of these keys set and the pod starts perfectly. Once #291 and #187 have
# landed, applying this directory is the whole decision to run cashback on a
# cluster; the values below are written for that state.
#
# That is the same mechanism the Hetzner deployment uses, expressed in the
# vocabulary Kubernetes has: there, listing docker-compose.cashback.yml in
# COMPOSE_FILE is the switch; here, `kubectl apply -f deploy/k8s/cashback/` is.
# `kubectl apply -f deploy/k8s/` does not recurse into subdirectories, so the
# base set can never drag the ledger in behind an operator's back.
#
# The addresses below are the ClusterIP Services in this directory, by name.
# Nothing here is a credential: BLNK_DATA_SOURCE_DNS is, and it lives in the
# Secret (examples/secret.example.yaml at the root of deploy/k8s).
apiVersion: v1
kind: ConfigMap
metadata:
  name: apivo-cashback-config
  labels:
    app.kubernetes.io/name: apivo-cashback-config
    app.kubernetes.io/part-of: apivo-news
    app.kubernetes.io/component: cashback
data:
  # The flag is designed to control route MOUNTING, not just navigation — once
  # T040 (#187) implements it. With it false or absent the cashback routes will
  # not exist and will answer 404, exactly as the
  # editorial routes do without JWKS_URL.
  CASHBACK_ENABLED: "true"
  # `blnk` here because this directory brings a Blnk to talk to. The other
  # two implementations of the port — `memory` and `postgres` — exist for
  # local development without Docker and as the documented exit route
  # (ADR-0002); neither belongs in a cluster that has a ledger running in it.
  LEDGER_DRIVER: "blnk"
  BLNK_URL: "http://blnk:5001"
  REDIS_URL: "redis://redis:6379"
  # The two house accounts the cashback design names: where the
  # sub-minor-unit rounding remainder of a percent earning accrues (D6) and
  # where an absorbed post-payout clawback loss is recorded (Q3). Both are
  # required with CASHBACK_ENABLED=true in production, which every deployed
  # environment is, and the api refuses to start anywhere if the two share a
  # name - one balance cannot carry two meanings. Set once and left alone:
  # renaming a house account strands whatever balance had accrued under the
  # old name.
  HOUSE_ACCOUNT_ROUNDING: "rounding-remainder"
  HOUSE_ACCOUNT_CLAWBACK: "clawback-loss"
  # Which affiliate network adapter the poller uses. EMPTY means `fixture`:
  # a scripted click -> pending -> approved -> reversed lifecycle served from
  # recorded responses, needing no credentials (ADR-0003). That is the safe
  # default while founder question Q1 — which networks to join — is open, and
  # it is what lets the whole money path run in a cluster before a publisher
  # account exists.
  #
  # Naming a live adapter here without its credentials in the Secret is a
  # configuration error the api reports at startup, rather than a poller that
  # silently fetches nothing.
  NETWORK_DRIVER: ""
  # The publisher account the adapter reports for. NOT a credential - the
  # config package logs it in clear, and its two companions
  # (NETWORK_API_KEY, NETWORK_API_SECRET) are Secrets precisely because this
  # one is not. Empty with the fixture adapter, which has no account.
  NETWORK_ACCOUNT_ID: ""
