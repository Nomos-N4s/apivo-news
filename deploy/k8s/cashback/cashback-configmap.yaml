# What applying this directory tells the api.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOES TODAY: it delivers the keys. It does not yet switch anything.
#
# The Go binary on `main` reads NONE of the variables below and mounts no
# cashback routes. Config parsing arrives with T001 (#291) and route mounting
# with T040 (#187); until both have landed, applying this directory gives a
# cluster a running Blnk and Redis and an api that ignores this ConfigMap
# entirely.
#
# The manifests are still correct and still worth having — the ledger has to
# exist before anything can be wired to it, and the wiring tasks need
# something to point at. But an operator applying this set today gets ledger
# INFRASTRUCTURE, not a working cashback product, and this file says so rather
# than letting them find out.
# ---------------------------------------------------------------------------
#
# The api Deployment lists this ConfigMap in `envFrom` with `optional: true`,
# so a cluster that has never applied `deploy/k8s/cashback/` runs the api with
# none of these keys set and the pod starts perfectly. Once #291 and #187 have
# landed, applying this directory is the whole decision to run cashback on a
# cluster; the values below are written for that state.
#
# That is the same mechanism the Hetzner deployment uses, expressed in the
# vocabulary Kubernetes has: there, listing docker-compose.cashback.yml in
# COMPOSE_FILE is the switch; here, `kubectl apply -f deploy/k8s/cashback/` is.
# `kubectl apply -f deploy/k8s/` does not recurse into subdirectories, so the
# base set can never drag the ledger in behind an operator's back.
#
# The addresses below are the ClusterIP Services in this directory, by name.
# Nothing here is a credential: BLNK_DATA_SOURCE_DNS is, and it lives in the
# Secret (examples/secret.example.yaml at the root of deploy/k8s).
apiVersion: v1
kind: ConfigMap
metadata:
  name: apivo-cashback-config
  labels:
    app.kubernetes.io/name: apivo-cashback-config
    app.kubernetes.io/part-of: apivo-news
    app.kubernetes.io/component: cashback
data:
  # The flag is designed to control route MOUNTING, not just navigation — once
  # T040 (#187) implements it. With it false or absent the cashback routes will
  # not exist and will answer 404, exactly as the
  # editorial routes do without JWKS_URL.
  CASHBACK_ENABLED: "true"
  # `blnk` here because this directory brings a Blnk to talk to. The other
  # two implementations of the port — `memory` and `postgres` — exist for
  # local development without Docker and as the documented exit route
  # (ADR-0002); neither belongs in a cluster that has a ledger running in it.
  LEDGER_DRIVER: "blnk"
  BLNK_URL: "http://blnk:5001"
  REDIS_URL: "redis://redis:6379"
  # The header this cluster's edge sets to carry the real client address,
  # for the privacy-minimised context digest a click records (FR-022) and
  # for the per-device half of the click rule (US7 scenario 1).
  #
  # Empty on purpose, and it stays empty until an ingress is configured to
  # set it AND to strip any inbound copy of it. Until then the digest is the
  # ingress's own address, which is still a context and is not one that
  # tells devices apart - so the per-device half of the rule stays off
  # rather than bracketing every member behind it. The per-member half is
  # unaffected and always applies.
  #
  # A header a client can set is a context a client can choose, and a chosen
  # context evades a per-device rule by changing on every request. Naming
  # one the edge does not own would be worse than naming none.
  CLICK_CONTEXT_HEADER: ""
  # The two house accounts the cashback design names: where the
  # sub-minor-unit rounding remainder of a percent earning accrues (D6) and
  # where an absorbed post-payout clawback loss is recorded (Q3). Both are
  # required with CASHBACK_ENABLED=true in production, which every deployed
  # environment is, and the api refuses to start anywhere if the two share a
  # name - one balance cannot carry two meanings. Set once and left alone:
  # renaming a house account strands whatever balance had accrued under the
  # old name.
  HOUSE_ACCOUNT_ROUNDING: "rounding-remainder"
  HOUSE_ACCOUNT_CLAWBACK: "clawback-loss"
  # And the account an earning is paid out of: the commission a network has
  # reported (FR-040). The member's share moves out of it and the rounding
  # to the account above, so what stays is Apivo's own cut - there is no
  # separate revenue account to reconcile against a balance that already
  # answers the same question. Required and distinct on the same terms.
  HOUSE_ACCOUNT_NETWORK_RECEIVABLE: "network-receivable"
  # The confirmed balance a member must reach before they may ask to be paid
  # (FR-050). Minor units, so 2000 EUR is twenty euros.
  #
  # Two keys and one value: the api refuses to start on one without the other,
  # because an amount with no currency is a number somebody compares a balance
  # against and gets right until a second currency is published (C-6). Zero is
  # a legitimate threshold and means any confirmed balance may be withdrawn,
  # so it is the PAIR being set that says one was configured - never the
  # number being non-zero. Required with CASHBACK_ENABLED=true in production,
  # which every deployed environment is.
  PAYOUT_THRESHOLD_MINOR: "2000"
  PAYOUT_THRESHOLD_CURRENCY: "EUR"
  # Which affiliate network adapter the poller uses. `fixture` is a scripted
  # click -> pending -> approved -> reversed lifecycle served from recorded
  # responses, needing no credentials (ADR-0003). That is the safe default
  # while founder question Q1 — which networks to join — is open, and it is
  # what lets the whole money path run in a cluster before a publisher
  # account exists.
  #
  # A COMMA-SEPARATED LIST, in the order the networks are wired, and each
  # entry gets a block of settings named after it: NETWORK_<DRIVER>_ACCOUNT_ID,
  # _API_KEY, _API_SECRET, _SOURCE_LANGUAGE. The list decides — a block whose
  # driver is not named here is read by nothing at all, deliberately, because
  # a network named here can be reported BY NAME when its keys are missing
  # and a network inferred from a stray block could not be.
  #
  # The flat NETWORK_DRIVER / NETWORK_ACCOUNT_ID / NETWORK_API_KEY /
  # NETWORK_API_SECRET / NETWORK_SOURCE_LANGUAGE keys this replaces are
  # REFUSED rather than aliased: a cluster still carrying them gets pods that
  # will not start and say which key to move, instead of a cluster that meant
  # to run two networks quietly running one.
  #
  # NAMED, not left empty. Empty is legal and polls nothing, but a cluster
  # that applied deploy/k8s/cashback/ meant to run the product.
  #
  # Naming a network here WITHOUT its account id and credential does not
  # crash the api — it stops CASHBACK. Every cashback route answers 404, the
  # startup log names the network and the key, and the news site keeps
  # serving: a typo in one network's key must not take the public site down.
  NETWORKS: "fixture"
  # The publisher account the adapter reports for. NOT a credential - the
  # config package logs it in clear, and its two companions
  # (NETWORK_FIXTURE_API_KEY, NETWORK_FIXTURE_API_SECRET) are Secrets
  # precisely because this one is not.
  #
  # Required even for the fixture adapter, which needs no credential: the two
  # durable cursors live on a cashback.network_account row and this is the
  # only value that says which one. An adapter that needs no credential still
  # polls on behalf of somebody. Leave it empty and cashback does not mount.
  NETWORK_FIXTURE_ACCOUNT_ID: "fixture-publisher"

  # The BCP-47 primary language subtag the network supplies its catalogue
  # copy in ("de", "en", "el"), as an operator states it. Configuration and
  # not detection: no network says what language a programme name is in, and
  # a merchant with no copy in the reader's language is shown the source
  # language LABELLED as a fallback rather than silently, so the label has to
  # come from somebody who knows.
  #
  # This and BRAND_DIR together turn the CATALOGUE IMPORT on. Empty means the
  # api serves normally, says at ERROR that no import is scheduled, and the
  # retailers members can click are never refreshed.
  #
  # Per network, because two networks may supply their copy in two languages
  # and one tag for both would put a wrong one on half the catalogue.
  NETWORK_FIXTURE_SOURCE_LANGUAGE: ""
  # HOLD_* are the hard rules that hold a suspicious credit for review (US7).
  # Every rule is off until its keys are set; a count and its window are one
  # rule and are refused apart. Windows are Go durations ("24h", "720h").
  HOLD_SHARED_CONTEXT_ACCOUNTS: ""
  HOLD_SHARED_CONTEXT_WINDOW: ""
  HOLD_NEW_ACCOUNT_AGE: ""
  HOLD_SALE_CAP_MINOR: ""
  HOLD_SALE_CAP_CURRENCY: ""
  HOLD_MEMBER_VELOCITY: ""
  HOLD_MEMBER_VELOCITY_WINDOW: ""
