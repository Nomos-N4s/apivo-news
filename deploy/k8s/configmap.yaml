# Non-secret runtime configuration for the Go api.
#
# Parity with local development (.env.example / docker-compose.yml):
#   HTTP_ADDR  — same key as .env.example; the api listens on :8080 here too.
#   APP_ENV    — .env.example uses "dev"; the cluster runs "prod" (the
#                binary accepts exactly "dev" or "prod").
#   LOG_LEVEL  — same default as .env.example.
#   JWKS_URL   — the auth provider's JWKS endpoint. NOT a secret (public
#                keys, published at a public URL), so it belongs here rather
#                than in the Secret. It is required for the editorial
#                endpoints: with it unset the api starts and serves readers
#                normally, logs an ERROR line naming the consequence, and
#                every /api/v1/editorial/ route answers 404.
#   JWT_AUDIENCE — optional; when set, tokens must additionally carry this
#                aud claim. Supabase access tokens carry "authenticated".
#                Only meaningful alongside JWKS_URL - setting it alone fails
#                startup.
#   DATABASE_URL is deliberately absent: it is a credential and lives in the
#   Secret (see secret.yaml).
#
# The JWKS_URL value below is a CHANGE-ME placeholder, not a real endpoint:
# replace the project reference before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apivo-config
  labels:
    app.kubernetes.io/name: apivo-config
    app.kubernetes.io/part-of: apivo-news
data:
  HTTP_ADDR: ":8080"
  APP_ENV: "prod"
  LOG_LEVEL: "info"
  JWKS_URL: "https://PLACEHOLDER_PROJECT.supabase.co/auth/v1/.well-known/jwks.json" # CHANGE-ME placeholder, not a credential
  JWT_AUDIENCE: "authenticated"
