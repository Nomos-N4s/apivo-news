# Astro frontend (Node adapter, standalone mode) — the only public HTTP
# surface, reached through web-service.yaml and web-ingress.yaml.
#
# `spec.replicas` is intentionally omitted: the HPA (web-hpa.yaml) owns the
# replica count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: apivo-news
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: apivo-news
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: apivo-news
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the `node` user baked into the web image.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so a single node failure or drain
      # cannot take out both (HPA minReplicas is 2 for availability).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
              app.kubernetes.io/part-of: apivo-news
      containers:
        - name: web
          # Placeholder until the container publish pipeline lands; real
          # deployments pin an image digest.
          image: ghcr.io/nomos-n4s/apivo-news/web:latest
          ports:
            - name: http
              containerPort: 4321
          env:
            # The @astrojs/node standalone server reads HOST/PORT; HOST must
            # be 0.0.0.0 to bind the pod interface (the default binds
            # localhost only). Kept inline rather than in the ConfigMap
            # because these are adapter mechanics, not app configuration.
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
            # Where the pages find the Go api: the ClusterIP Service in
            # api-service.yaml, by name, on the port it declares. The api
            # has no public route, so this internal address is the only
            # one there is. Without it every page renders from built-in
            # fixtures — a container that looks healthy and serves nothing
            # real — so it is set here rather than left to a ConfigMap the
            # deployment does not read.
            - name: API_BASE_URL
              value: "http://api:8080"
            # A cluster is a deployed environment, and the frontend must
            # know it: in prod the reader REFUSES to answer from the
            # built-in fixtures rather than presenting invented publishers
            # under an invented approver as the published record. The line
            # above is what keeps that refusal from ever firing here; this
            # line is what makes forgetting the line above a loud failure
            # instead of a quiet fabrication.
            - name: APP_ENV
              value: "prod"
            # Supabase Auth for the editorial sign-in. Neither is a
            # credential: the anon key identifies the project and grants
            # nothing on its own. They belong to the web container alone,
            # which is why they sit here and not in apivo-config — that
            # ConfigMap is the api's, and mounting it whole would hand the
            # web the api's listen address.
            #
            # Both ship EMPTY, the same convention as the api's JWKS_URL:
            # empty means exactly "not configured yet" — the sign-in page
            # says so and the editorial screens stay a preview — and no
            # placeholder can fake a configuration. Set them, together
            # with the api's JWKS_URL, to let editors sign in.
            - name: PUBLIC_SUPABASE_URL
              value: ""
            - name: PUBLIC_SUPABASE_ANON_KEY
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The web has no dedicated health route yet, so both probes hit /.
          # Point them at a dedicated route when one lands — and that route
          # must not depend on the api or the database, or web restarts
          # become coupled to backend health.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
