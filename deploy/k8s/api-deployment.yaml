# Go API. Cluster-internal only — exposed by a ClusterIP Service
# (api-service.yaml) and deliberately absent from the Ingress, per the
# contract topology (specs/001-epiloyes-alpha/contracts/http-api.md).
#
# `spec.replicas` is intentionally omitted: the HPA (api-hpa.yaml) owns the
# replica count, and omitting it here keeps `kubectl apply` from fighting the
# autoscaler.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: apivo-news
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: apivo-news
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: apivo-news
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the distroless nonroot user baked into the api image.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so a single node failure or drain
      # cannot take out both (HPA minReplicas is 2 for availability).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/part-of: apivo-news
      containers:
        - name: api
          # Placeholder until the container publish pipeline lands; real
          # deployments pin an image digest.
          image: ghcr.io/nomos-n4s/apivo-news/api:latest
          ports:
            - name: http
              containerPort: 8080
          # Non-secret env (HTTP_ADDR, APP_ENV, LOG_LEVEL, JWKS_URL,
          # JWT_AUDIENCE) — parity with .env.example, documented in
          # configmap.yaml. JWKS_URL carries only public keys' location, so
          # it is configuration, not a credential; without it the editorial
          # routes are unmounted (the api logs an ERROR line and readers
          # keep serving).
          envFrom:
            - configMapRef:
                name: apivo-config
            # The cashback keys (CASHBACK_ENABLED, LEDGER_DRIVER, BLNK_URL,
            # REDIS_URL, NETWORKS), delivered only on a cluster that has
            # applied deploy/k8s/cashback/. `optional: true` is what makes
            # that directory a genuine opt-in: without it the ConfigMap does
            # not exist, none of those keys reach the binary, and the pod
            # starts normally. With it a missing ConfigMap would block every
            # api pod on a cluster that never wanted a ledger.
            #
            # Note what this does NOT yet do: the binary on `main` reads none
            # of those keys and mounts no cashback routes. Config parsing is
            # T001 (#291) and route mounting is T040 (#187). Until both land,
            # this reference delivers variables the api ignores — which is
            # harmless, and is the point of wiring it now, but is not the same
            # thing as enabling cashback.
            #
            # Same shape as the Hetzner deployment, in the vocabulary
            # Kubernetes has: there, listing docker-compose.cashback.yml in
            # COMPOSE_FILE is the switch; here, applying the subdirectory is.
            - configMapRef:
                name: apivo-cashback-config
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apivo-secrets
                  key: DATABASE_URL
            # The translation provider credential (T018). Secrets are
            # mapped one by one - envFrom above covers only the ConfigMap,
            # so a key not named here never reaches the binary. optional:
            # a self-hosted provider needs no key and the Secret is
            # created out of band, so its absence must not block the pod;
            # the binary treats a missing key as "no Authorization
            # header", and the pipeline itself stays off until the
            # non-secret TRANSLATION_* keys are set in the ConfigMap.
            - name: TRANSLATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apivo-secrets
                  key: TRANSLATION_API_KEY
                  optional: true
            # The api's half of the ledger credential; the ledger's half is
            # BLNK_SERVER_SECRET_KEY in deploy/k8s/cashback, and the two must
            # be equal. `optional: true` for the same reason the cashback
            # ConfigMap reference is optional: a cluster that never applied
            # deploy/k8s/cashback/ has no ledger and needs no key, and a
            # required reference would block every api pod on such a cluster.
            #
            # It is NOT optional in effect once cashback is on: the cluster
            # runs APP_ENV=prod, and the api refuses to start with
            # CASHBACK_ENABLED=true and this unset. Optional here means "the
            # Secret need not carry it", not "the product works without it".
            - name: BLNK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: apivo-secrets
                  key: BLNK_SECRET_KEY
                  optional: true
            # One affiliate network's credentials, named after its driver -
            # the api reads NETWORK_<DRIVER>_*, so a second network means a
            # second pair here. Absent while NETWORKS names only `fixture`,
            # which needs none; required once a live network is named, and
            # without them CASHBACK DOES NOT MOUNT - every cashback route
            # answers 404 and the startup log says which key. The pod itself
            # still starts and serves the news site.
            - name: NETWORK_FIXTURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apivo-secrets
                  key: NETWORK_FIXTURE_API_KEY
                  optional: true
            - name: NETWORK_FIXTURE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: apivo-secrets
                  key: NETWORK_FIXTURE_API_SECRET
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Health endpoints from the platform HTTP server:
          # /healthz = liveness, /readyz = readiness (DB ping).
          #
          # The startup probe owns the boot window: the binary runs schema
          # migrations before it listens, so liveness must not race them
          # (up to ~60s allowed before the first liveness check).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # The readiness check is a real round-trip to external Postgres
          # (Supabase, cross-region): 1s default timeout would mark healthy
          # pods unready on routine latency spikes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
