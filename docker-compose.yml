# Local development stack: `docker compose up --build` starts Postgres, the
# Go API (which migrates the schema on start) and the Astro frontend. Per
# the HTTP contract's topology the API publishes no host port — it is
# reachable only on the internal compose network, by service name. The web
# service is the only published HTTP surface (http://localhost:4321);
# Postgres is also published, on loopback, for local tooling and tests.
# Host bindings are loopback-only so the dev stack never listens on the LAN.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apivo
      POSTGRES_USER: apivo
      POSTGRES_PASSWORD: apivo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apivo -d apivo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Go API. No `ports`: internal network only (contract topology). The
  # image defines its own healthcheck, which `depends_on` below relies on.
  api:
    build: .
    environment:
      DATABASE_URL: postgres://apivo:apivo@postgres:5432/apivo?sslmode=disable
      HTTP_ADDR: ":8080"
      APP_ENV: dev
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  # Astro frontend — the only published HTTP surface, loopback-only.
  web:
    build: ./web
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      # Reader pages render server-side from the Go API by service name
      # (contract topology). Uncomment once the reader endpoints land
      # (T023/T024, issues #26/#27) — the Go server does not register
      # /api/v1/front yet, and until it does the pages preview from
      # built-in fixtures.
      # API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
