# Local development stack: `docker compose up --build` starts Postgres, the
# Go API (which migrates the schema on start) and the Astro frontend. Per
# the HTTP contract's topology the API publishes no host port — it is
# reachable only on the internal compose network, by service name. The web
# service is the only published HTTP surface (http://localhost:4321);
# Postgres is also published, on loopback, for local tooling and tests.
# Host bindings are loopback-only so the dev stack never listens on the LAN.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apivo
      POSTGRES_USER: apivo
      POSTGRES_PASSWORD: apivo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apivo -d apivo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Go API. No `ports`: internal network only (contract topology). The
  # image defines its own healthcheck, which `depends_on` below relies on.
  api:
    build: .
    environment:
      DATABASE_URL: postgres://apivo:apivo@postgres:5432/apivo?sslmode=disable
      HTTP_ADDR: ":8080"
      APP_ENV: dev
      LOG_LEVEL: info
      # JWT verification for the editorial endpoints. Taken from the host
      # environment (or .env) so no placeholder is baked in: unset means the
      # /api/v1/editorial/ routes are not mounted and the api logs an ERROR
      # line saying so at startup. JWT_AUDIENCE is optional and only
      # meaningful alongside JWKS_URL.
      JWKS_URL: ${JWKS_URL:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Astro frontend — the only published HTTP surface, loopback-only.
  web:
    build: ./web
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      # Every page renders server-side from the Go API by service name
      # (contract topology). The api publishes no host port, so this
      # internal address is the only way to reach it.
      API_BASE_URL: http://api:8080
      # Supabase Auth for the editorial sign-in. Taken from the host
      # environment (or .env) so no placeholder is baked in, exactly like
      # the api's JWKS_URL above — and the two are halves of one setting:
      # the web signs the editor in, the api verifies the token that
      # sign-in produced. Unset, the sign-in page says so and the
      # editorial screens keep their fixture preview.
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
