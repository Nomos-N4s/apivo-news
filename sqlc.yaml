version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/platform/db/migrations"
    queries: "internal/content/queries"
    gen:
      go:
        package: "store"
        out: "internal/content/store"
        sql_package: "pgx/v5"
  # One generated package per module, so a module's queries live inside the
  # module that owns them and no module reads another's internals.
  - engine: "postgresql"
    schema: "internal/platform/db/migrations"
    queries: "internal/editorial/queries"
    gen:
      go:
        package: "store"
        out: "internal/editorial/store"
        sql_package: "pgx/v5"
  # The cashback domain applies the same rule one level down (T029): each of
  # its sub-packages owns its queries and generated store
  # (internal/cashback/<pkg>/queries -> internal/cashback/<pkg>/store), so a
  # later sub-package (networks, earnings, ...) adds its own entry beside
  # this one instead of widening it.
  - engine: "postgresql"
    schema: "internal/platform/db/migrations"
    queries: "internal/cashback/catalogue/queries"
    gen:
      go:
        package: "store"
        out: "internal/cashback/catalogue/store"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    schema: "internal/platform/db/migrations"
    queries: "internal/cashback/networks/queries"
    gen:
      go:
        package: "store"
        out: "internal/cashback/networks/store"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    schema: "internal/platform/db/migrations"
    queries: "internal/cashback/ops/queries"
    gen:
      go:
        package: "store"
        out: "internal/cashback/ops/store"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    schema: "internal/platform/db/migrations"
    queries: "internal/cashback/clickout/queries"
    gen:
      go:
        package: "store"
        out: "internal/cashback/clickout/store"
        sql_package: "pgx/v5"
