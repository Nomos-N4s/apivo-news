# The release pipeline (issue #119). Releases are cut ONLY from annotated
# semver tags: pushing v0.1.0 is the release act; nothing else releases.
# main stays always-green and always-deployable, and merging to main deploys
# to QA and to nowhere else.
#
#   guard -> verify (the full CI matrix, reused) -> [approval, prod only]
#         -> publish (build, prove the stamp, MOVE THE CHANNEL)
#         -> GitHub Release -> health probe
#
# The tag decides which environment it is a release TO. A pre-release tag
# (v0.2.0-rc.1) moves the `staging` channel; a final tag (v0.2.0) moves
# `prod`. One pipeline, one guard, one set of notes, two destinations — so
# the path to production is the path staging has already rehearsed, rather
# than one nobody has run before the day it matters.
#
# Moving a channel tag is the whole deploy. This workflow cannot reach a
# host, holds no SSH key and opens no connection to a VPS: each host asks the
# registry, every minute, whether its channel has moved, and converges if it
# has (deploy/hetzner/bin/apivo-reconcile).
#
# Rehearsal: "Run workflow" (workflow_dispatch) from a tag ref with dry_run
# checked runs everything except the channel move, the GitHub Release and the
# probe. Dispatching with dry_run UNCHECKED performs a real release of that
# tag - which is also the rollback mechanism: re-run the previous tag.
#
# That rollback runs through a tag that has already been released, so the
# whole path is built for it: the guard demands the tag still name the
# commit its published Release was cut from, publishing the Release is
# idempotent, and the probe runs on any channel move that happened - a
# rollback that came up healthy reads green.
#
# Operator setup (one-time) and the semver discipline: docs/RELEASING.md.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: verify and stamp everything; move no channel and publish nothing."
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, never cancelled: interrupting a release half-way is
# strictly worse than letting it finish and releasing again.
concurrency:
  group: release

jobs:
  # Gate first: an unmerged or lightweight or misnamed tag is refused before
  # a single test runs. The guard's own test suite runs first - a gate is
  # only trustworthy while its proof is green.
  guard:
    runs-on: ubuntu-latest
    # Every job is bounded: the concurrency group above serialises releases
    # and never cancels, so a job that hangs holds up the next release - and
    # the next release is also the rollback. (The verify job below cannot
    # carry a timeout: a job that only says `uses:` takes no other keys.)
    timeout-minutes: 15
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      channel: ${{ steps.mode.outputs.channel }}
      health_url: ${{ steps.mode.outputs.health_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, all branches and tags: the guard needs origin/main
          # and the tag object itself.
          fetch-depth: 0
      - name: Prove the guard and the notes themselves
        run: |
          sh scripts/release_guard_test.sh
          sh scripts/release_notes_test.sh
      - name: Require a tag ref
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          # Through the environment rather than interpolated into the script:
          # a ref is data, and this workflow holds the deploy credentials.
          REF: ${{ github.ref }}
        run: |
          echo "::error::the release workflow runs only from a tag ref; pick the tag under 'Use workflow from' when dispatching (got $REF)"
          exit 1
      # What the already-published Release for this tag says it was cut from,
      # which is the one question the guard cannot answer from git alone. The
      # notes generator writes that line into every Release this pipeline
      # publishes (scripts/release_notes.sh); the guard compares it with the
      # commit the tag points at now and refuses a tag that has moved.
      - name: Read the commit the published Release records
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null); then
            echo "no GitHub Release exists for $GITHUB_REF_NAME yet"
            echo "commit=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The backticks below are literal markdown from the Release body,
          # not a command substitution - the expression must stay unexpanded.
          # shellcheck disable=SC2016
          commit=$(printf '%s\n' "$body" | sed -n 's/^Released from commit `\([0-9a-f]\{40\}\)`\.$/\1/p' | head -n 1)
          echo "a GitHub Release for $GITHUB_REF_NAME exists, recording commit: ${commit:-none}"
          echo "commit=${commit:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Guard the tag (annotated semver, merged to main, not moved)
        env:
          RELEASED_COMMIT: ${{ steps.published.outputs.commit }}
        run: sh scripts/release_guard.sh "${GITHUB_REF_NAME}" origin/main "${RELEASED_COMMIT}"
      - name: Record the version
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Which environment this tag is a release to, and where to prove it
      # came up. The pre-release test is the same one that decides how the
      # GitHub Release is published below - build metadata is stripped first,
      # so the "-" that decides is the one before "+".
      - name: Record the mode, the channel and the probe target
        id: mode
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          echo "dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          # Where each environment answers is committed
          # (deploy/hetzner/environments.env), not held in a settings screen:
          # a value that lives only in a dashboard has no history, no review
          # and no diff when it changes. Reading it from the tagged commit is
          # safe for the same reason the rest of this pipeline is - a release
          # only ever runs from a tag the guard has proved is merged to main.
          . ./deploy/hetzner/environments.env
          case "${VERSION%%+*}" in
          *-*)
            channel=staging
            health="$APIVO_STAGING_URL"
            ;;
          *)
            channel=prod
            health="$APIVO_PROD_URL"
            ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "health_url=$health" >> "$GITHUB_OUTPUT"
          echo "$VERSION is a release to the '$channel' channel"

      # THERE IS NO PRODUCTION ENVIRONMENT YET - no VPS, no Supabase project,
      # no DNS record. A final semver tag would move the `prod` channel to an
      # image no host tracks, publish a GitHub Release announcing it, and
      # then fail at the probe having already told the world.
      #
      # So it is refused here instead, before anything is published, and the
      # refusal names what is missing. The presence of APIVO_PROD_URL is the
      # signal: filling it in is the last step of provisioning that host, and
      # it is the thing the probe cannot work without.
      #
      # Release candidates (v0.2.0-rc.1) are unaffected and are the whole
      # point of the pre-1.0 phase: they exercise this identical pipeline
      # against staging, so that the first production release is the first
      # time this workflow has run to a NEW HOST, not the first time it has
      # run at all.
      - name: Refuse a production release while production does not exist
        if: steps.mode.outputs.channel == 'prod' && steps.mode.outputs.health_url == ''
        run: |
          echo "::error::${{ steps.tag.outputs.version }} is a FINAL release, which targets production - and there is no production environment yet (APIVO_PROD_URL is empty in deploy/hetzner/environments.env). Nothing was published. Cut a release candidate instead (git tag -a v0.2.0-rc.1) to release to staging, or provision the production host first: docs/ENVIRONMENTS.md."
          exit 1

  # The full CI matrix on the tagged commit, by calling ci.yml rather than
  # copying its jobs: what "verified" means is defined in exactly one place.
  verify:
    needs: guard
    uses: ./.github/workflows/ci.yml

  # A human, once, before production changes.
  #
  # Everything else in this pipeline is automatic, and deliberately so: an
  # agent can take a change from a PR to a running QA environment without
  # anyone's hand on it, and a release candidate reaches staging the same
  # way. This is the one gate, and it exists because production is the only
  # environment where being wrong costs something that cannot be re-run.
  #
  # The reviewers are configured on the `production` GitHub Environment
  # (Settings -> Environments), not here - so who may approve a release is
  # not a thing this file can quietly change.
  approve:
    needs: [guard, verify]
    if: needs.guard.outputs.channel == 'prod' && needs.guard.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    environment: production
    steps:
      - name: Approved
        run: echo "production release of ${{ needs.guard.outputs.version }} approved"

  # Build both images, prove the published artefact names its own version,
  # and move the channel. Moving the channel IS the deploy: every host
  # tracking it converges within a minute, with no instruction from here.
  publish:
    needs: [guard, verify, approve]
    if: |
      always() && needs.verify.result == 'success' &&
      needs.guard.outputs.dry_run != 'true' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      channel: ${{ needs.guard.outputs.channel }}

  release:
    needs: [guard, verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Publishing the Release writes to the repository; everything else reads.
      contents: write
    outputs:
      # Set only when a channel actually moved, and read by the probe: what
      # must be verified is a deployment that happened, whatever the steps
      # after it did.
      deployed: ${{ steps.deployed.outputs.deployed }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      DRY_RUN: ${{ needs.guard.outputs.dry_run }}
      CHANNEL: ${{ needs.guard.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the release notes walk back to the
          # previous semver tag.
          fetch-depth: 0

      # The version stamp is no longer proved here. publish.yml proves it on
      # the image that is actually in the registry - by running it and making
      # it say its own version - before it moves any channel, which is a
      # stronger claim than a local build that resembles the published one.

      - name: Generate the release notes
        run: |
          sh scripts/release_notes.sh "$VERSION" > release-notes.md
          {
            echo "## Release notes ($VERSION)"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Dry run: stop before releasing'
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "## DRY RUN - nothing was released"
            echo
            echo "Guard, CI matrix and note generation all passed for $VERSION,"
            echo "which would have moved the \`$CHANNEL\` channel."
            echo "No images published, no channel moved, no GitHub Release, no probe."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record that the channel moved
        id: deployed
        if: env.DRY_RUN != 'true'
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Idempotent, because re-releasing a tag is the documented
          # rollback: `gh release create` answers 422 when a Release for the
          # tag exists, which failed the run AFTER the channel had already
          # been moved back - a red run for a rollback that happened, and a
          # skipped probe in the one situation where "did it come up?"
          # matters most.
          #
          # A pre-release tag is published as a pre-release: the guard admits
          # v0.2.0-rc.1 deliberately, and an RC published as a normal release
          # is read as stable by everything that looks. Build metadata is
          # stripped first, so the "-" that decides is the one before "+".
          prerelease=false
          case "${VERSION%%+*}" in
          *-*) prerelease=true ;;
          esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file release-notes.md --prerelease="$prerelease"
            echo "updated the existing GitHub Release for $VERSION (pre-release: $prerelease)"
          else
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file release-notes.md --prerelease="$prerelease"
            echo "created the GitHub Release for $VERSION (pre-release: $prerelease)"
          fi

  # A release that did not come up is a failed release, reported honestly -
  # and so is a release nobody asked. Both paths below exit non-zero.
  #
  # The gate is the CHANNEL MOVE, not the release job's verdict: once the
  # channel has moved the environment will change, and it must be probed even
  # if publishing the Release afterwards failed. always() lets this job run
  # over a failed `release`; `deployed` is set only once the channel has
  # actually moved, so a run that never got that far (guard refused, CI red,
  # dry run, approval denied) still skips the probe.
  probe:
    needs: [guard, release]
    if: always() && needs.release.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      CHANNEL: ${{ needs.guard.outputs.channel }}
      HEALTH_URL: ${{ needs.guard.outputs.health_url }}
    steps:
      - name: Probe /healthz and /readyz
        run: |
          # An unprobed release is a failed release. The variable is
          # satisfiable in every environment this pipeline can target - the
          # Caddy edge routes /healthz and /readyz to the api container in
          # all of them - so leaving it unset is a choice: a deploy nobody
          # checked came up.
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::release $VERSION moved the '$CHANNEL' channel but was NOT probed: APIVO_$(echo "$CHANNEL" | tr '[:lower:]' '[:upper:]')_URL is empty in deploy/hetzner/environments.env, so nothing verified that the environment came up. Set it to that environment's public base URL (docs/RELEASING.md) and re-run. The channel HAS moved - roll back by re-running this workflow from the previous tag with dry_run unchecked."
            {
              echo "## FAILED: release $VERSION was not probed"
              echo
              echo "The channel moved and the environment will change, but no"
              echo "variable said where to check that it did."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          base="${HEALTH_URL%/}"
          for path in /healthz /readyz; do
            echo "probing $base$path"
            # The retries cover the whole pull-based path, which is longer
            # than a push-based deploy's: up to a minute before the host's
            # timer next fires, then the pull, the rollout and the api's
            # schema migration on boot. ~5 minutes total, after which a
            # refusal is a refusal.
            if ! curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors --max-time 20 "$base$path" > answer.json; then
              echo "::error::release $VERSION moved the '$CHANNEL' channel but $base$path does not answer 200: the release did not come up. Check the host's reconciler log (journalctl -u apivo-reconcile@$CHANNEL), or roll back by re-running this workflow from the previous tag with dry_run unchecked (docs/RELEASING.md)."
              exit 1
            fi
            # A 200 only says something is serving, and the previous
            # container answers 200 just as happily. What proves the release
            # is the version in the payload - stamped into the binary at
            # build time, and proven to be there before the channel moved.
            # Anything but $VERSION means this environment did not roll
            # forward, whatever the status code says.
            served=$(jq -r '.version // ""' answer.json 2>/dev/null || true)
            if [ "$served" != "$VERSION" ]; then
              echo "::error::release $VERSION moved the '$CHANNEL' channel but $base$path is answered by version '${served:-none}', not $VERSION: the environment did not roll forward and something else is still serving. The host may have rolled back on its own - check 'journalctl -u apivo-reconcile@$CHANNEL' for a rollout_failed line (docs/ENVIRONMENTS.md)."
              exit 1
            fi
            echo "$path answered 200 as version $served"
          done
          echo "release $VERSION serves on $CHANNEL: /healthz and /readyz answered 200 as $VERSION" >> "$GITHUB_STEP_SUMMARY"
