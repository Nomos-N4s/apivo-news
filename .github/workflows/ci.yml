name: ci

on:
  pull_request:
  # A merge queue, when one is enabled on `main`, tests each pull request
  # against the queue's projected result rather than against the `main` it was
  # branched from. Without this trigger the queue has nothing to gate on and
  # every merge goes in unchecked.
  #
  # It matters here more than in most repositories: every merge to `main`
  # publishes and deploys to QA, so two pull requests that are each green
  # alone and broken together do not just break the branch, they break the
  # environment agents are looking at. Enabling the queue itself is a branch
  # protection setting — this only makes the workflow ready for it.
  merge_group:
  # Two pipelines replay this exact matrix by CALLING the workflow rather
  # than duplicating its jobs, so what "verified" means is defined in one
  # place:
  #
  #   publish.yml   on every push to main, before any image is published
  #   release.yml   on the tagged commit, before any release is cut
  #
  # There is deliberately no `push: branches: [main]` trigger. publish.yml
  # owns that path now: it runs on every merge, calls this workflow first,
  # and publishes only if the matrix is green. Keeping the trigger as well
  # would run the whole matrix twice per merge to learn the same thing about
  # the same tree — and dropping it costs no coverage, including the
  # commit-hygiene job's check of merge-time messages, which PR CI never
  # sees but publish.yml's call does.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Server-side belt and braces for the .githooks/commit-msg hook: hooks are
  # per-clone opt-in, so the same rules are enforced here where they cannot
  # be skipped. Runs on PRs, and on every merge to main through publish.yml's
  # call - merge-time messages such as squash commits never pass through PR
  # CI, so that second path is the only thing that checks them.
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine commit range
        id: range
        env:
          # Event data through the environment, never interpolated into the
          # script itself.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # A range is used only when there is a real commit to measure from.
          # Anything else - the first push to a new ref (before is all
          # zeroes), or an event carrying no "before" at all, which is what
          # release.yml's workflow_call on a dispatched tag looks like - falls
          # back to the head commit. It must NOT fall back to "..$SHA": git
          # reads that as HEAD..$SHA, which is empty in a fresh checkout, so
          # the job would check nothing and report green.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "range=$BASE_SHA..$HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$BEFORE" | grep -q -E '^[0-9a-f]{7,}$' && ! printf '%s' "$BEFORE" | grep -q -E '^0+$'; then
            echo "range=$BEFORE..$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "range=$SHA -1" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject AI attribution trailers
        run: |
          # Materialized first so a git failure fails the step (no fail-open
          # empty pipe), and merge commits are deliberately included.
          git log --format='%H %B%n----' ${{ steps.range.outputs.range }} > /tmp/commits.txt
          if grep -in -E '(co-authored-by:.*(noreply@anthropic\.com|claude)|generated with \[?claude|claude-session:)' /tmp/commits.txt; then
            echo "::error::Commit messages must not carry AI attribution trailers."
            exit 1
          fi
      - name: Require Conventional Commit subjects
        run: |
          git log --no-merges --format='%s' ${{ steps.range.outputs.range }} > /tmp/subjects.txt
          BAD=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" | grep -q -E '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9., /-]+\))?!?: .+'; then
              echo "::error::Not a Conventional Commit subject: $subject"
              BAD=1
            fi
          done < /tmp/subjects.txt
          exit "$BAD"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: apivo
          POSTGRES_USER: apivo
          POSTGRES_PASSWORD: apivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apivo -d apivo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://apivo:apivo@localhost:5432/apivo?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (invariant tests run against the service Postgres)
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
      # The drill logs a timing per provenance chain, and those numbers are
      # the point (I-5: the audit must be demonstrably fast, not asserted
      # fast) - but a passing non-verbose `go test` swallows t.Logf. Run it
      # once more verbosely so every CI run records what the audit costs.
      - name: I-5 drill timings (verbose, for the record)
        run: go test -v -run TestProvenanceI5DrillAgainstSchema ./internal/editorial/
      # The journey's Z-suffix assertions guard every wire and audit-payload
      # timestamp render. They can only fail on a non-UTC host, and the
      # runners are UTC - so without this leg a dropped .UTC() ships green.
      # Linux honours TZ; Windows does not, which is why the gate lives here
      # rather than in the quickstart's local instructions.
      - name: journey under a non-UTC clock
        run: go test -count=1 -run TestAlphaDefinitionOfDoneJourney ./cmd/apivo/
        env:
          TZ: Europe/Athens
      - name: Coverage gate (90%)
        run: sh scripts/coverage_gate.sh 90 coverage.out

  # Proves the Dockerfile builds; the image is never pushed from CI.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image (no push)
        run: docker build -t apivo:${{ github.sha }} .

  sqlc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate store from schema
        run: sh scripts/pull_retry.sh sqlc/sqlc:1.31.1 && docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:1.31.1 generate
      - name: Fail on drift between schema and committed generated code
        run: |
          # git add first so brand-new generated files count as drift too.
          git add -A internal/content/store internal/editorial/store
          git diff --cached --exit-code -- internal/content/store internal/editorial/store

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Kubernetes manifests (strict)
        run: >-
          sh scripts/pull_retry.sh
          ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e &&
          docker run --rm -v "$PWD/deploy/k8s:/manifests"
          ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
          -strict -summary -kubernetes-version 1.32.0 /manifests

  # The VPS deployment, proved without a VPS.
  #
  # This is to the Hetzner deployment what the `wrangler` job below is to the
  # Cloudflare one: everything about the configuration that can be known
  # without credentials or a host, known on every PR instead of on the next
  # deploy. The reconciler's own test suite runs here for the reason the
  # release workflow proves its guard before trusting it — apivo-reconcile is
  # the only thing standing between a bad image and every environment that
  # tracks its channel.
  hetzner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prove the reconciler's decisions
        run: sh deploy/hetzner/bin/apivo-reconcile_test.sh
      - name: Prove the preview reconciler's decisions
        # It destroys environments on absence, so the cases where absence is
        # a lie (an unreachable registry, an expired credential) are the ones
        # this suite exists for.
        run: sh deploy/hetzner/bin/apivo-previews_test.sh
      - name: Prove the editor seeder's decisions
        # It writes to a database and creates users in an auth project. The
        # assertions that matter are that the account row carries the id
        # Supabase issued, that a re-run reaches the same id rather than
        # orphaning the row, and that production is refused.
        run: sh deploy/hetzner/bin/apivo-seed-editors_test.sh
      - name: Lint every shell script that runs on a deployment host
        # A syntax error in any of these is only discoverable on the box
        # otherwise, and two of them run as root there.
        run: |
          shellcheck -s sh \
            deploy/hetzner/bin/apivo-reconcile \
            deploy/hetzner/bin/apivo-reconcile_test.sh \
            deploy/hetzner/bin/apivo-previews \
            deploy/hetzner/bin/apivo-previews_test.sh \
            deploy/hetzner/bin/apivoctl \
            deploy/hetzner/bin/apivo-seed-editors \
            deploy/hetzner/bin/apivo-seed-editors_test.sh \
            deploy/hetzner/provision.sh \
            deploy/hetzner/validate.sh \
            scripts/env_status.sh
      - name: Validate the compose and Caddy configuration
        run: sh deploy/hetzner/validate.sh

  ts-types-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: apivo
          POSTGRES_USER: apivo
          POSTGRES_PASSWORD: apivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apivo -d apivo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply migrations to the service Postgres
        run: sh scripts/pull_retry.sh migrate/migrate:v4.19.1 && docker run --rm -v "$PWD/internal/platform/db/migrations":/m --network host migrate/migrate:v4.19.1 -path /m -database "postgres://apivo:apivo@localhost:5432/apivo?sslmode=disable" up
      # The supabase CLI runs its generator in a container it pulls itself,
      # so the pull is warmed first: a registry rate limit is an
      # infrastructure failure and must not be reported as schema drift.
      - name: Pre-pull the type generator image
        run: sh scripts/pull_retry.sh public.ecr.aws/supabase/postgres-meta:v0.97.0
      - name: Regenerate types from schema
        # Written to a temporary file first: a failed generation must not
        # truncate the committed types and make the drift check below report
        # a difference that does not exist. The temporary file sits in the
        # destination directory so the replacement is a rename within one
        # filesystem - from /tmp it could degrade to copy-then-delete, which
        # is exactly the partial write being guarded against.
        run: |
          npx --yes supabase@2.114.0 gen types typescript \
            --db-url "postgres://apivo:apivo@localhost:5432/apivo?sslmode=disable" \
            > web/src/lib/database.types.ts.new
          mv web/src/lib/database.types.ts.new web/src/lib/database.types.ts
      - name: Fail on drift between schema and committed generated code
        run: |
          # git add first so brand-new generated files count as drift too.
          git add -A web/src/lib
          git diff --cached --exit-code -- web/src/lib

  # Validates the committed OpenAPI document - the one the binary embeds and
  # serves at /api/v1/openapi.json - against the OpenAPI 3.1 specification.
  # The version is pinned so the ruleset cannot change under a green build;
  # bump it together with the Makefile's OPENAPI_VALIDATOR_VERSION. Rule
  # severities live in redocly.yaml; the job fails on any error.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate the OpenAPI document
        run: npx --yes @redocly/cli@2.46.1 lint api/openapi.json

  # RETIRED but still proved. Nothing deploys to Cloudflare Containers any
  # more (docs/ENVIRONMENTS.md) - the application runs on a Hetzner VPS, and
  # the `hetzner` job above is what validates that. This job stays because
  # the Worker still carries the per-caller rate limit on the editorial
  # endpoints, which Caddy does not, and a rule nobody proves is a rule
  # nobody can safely port. It goes when the limit becomes Go middleware.
  #
  # Validates the Cloudflare Containers configuration: full parse of
  # wrangler.jsonc plus Worker bundle and container/DO wiring checks.
  # --dry-run needs no Cloudflare credentials and uploads nothing;
  # --containers-rollout none skips the Docker image builds, which have
  # their own jobs; config validation runs against the real Dockerfiles.
  #
  # The Worker's own routing rules are proved here too. They decide which
  # container answers, what the container is told about the caller, and what
  # the caller is told about indexing — decisions that used to be provable
  # only by deploying. Node's built-in test runner, no dependency to add.
  wrangler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate Cloudflare configuration (dry run, no credentials)
        run: npx --yes wrangler@4 deploy --dry-run --containers-rollout none
      - name: Prove the Worker's routing rules
        run: node --test 'deploy/cloudflare/*.test.mjs'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Test (coverage gate 80%)
        run: npm test
      - name: Build
        run: npm run build

  # Proves the frontend container builds from a clean checkout. Build only —
  # publishing is a deployment concern, not a CI gate.
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the frontend image (no push)
        run: docker build -t apivo-web:ci web/
